# Provide defaults for DB connection placeholders so app can start when env vars are not set
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:demo}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:password}
# Explicit driver (Spring Boot will usually detect, but set it to be explicit)
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=true
# Ensure Hibernate knows which dialect to use if JDBC metadata cannot be obtained yet
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


